watch_stylesheet: true
watch_config: true
debug: false
update_check: true

bars:
  primary-bar:
    enabled: true
    screens: ["*"]
    class_name: "yasb-bar"
    alignment:
      position: "top"
      center: false
    blur_effect:
      enabled: false
      acrylic: false
      dark_mode: true
      round_corners: false
      border_color: "None"
    window_flags:
      always_on_top: true
      windows_app_bar: true
      hide_on_fullscreen: true
    dimensions:
      width: "100%"
      height: 38
    padding:
      top: 6
      left: 14
      bottom: 0
      right: 14
    widgets:
      left:
        - "clock"
        - "phone_notifications"
      center:
        - "weather"
        - "cpu"
        - "memory"
        - "traffic"
        - "volume"
      right:
        - "systray"

widgets:
  clock:
    type: "yasb.clock.ClockWidget"
    options:
      label: "{%I:%M %p} <span class='sep'>|</span>"
      label_alt: "{%A, %d %B %Y} <span class='sep'>|</span>"
      update_interval: 1000
      callbacks:
        on_left: "toggle_calendar"
        on_right: "toggle_label"
      container_padding:
        top: 0
        left: 0
        bottom: 0
        right: 0

  phone_notifications:
    type: "yasb.custom.CustomWidget"
    options:
      class_name: "custom-widget"
      label: "{data}"
      label_alt: "{data}"
      exec_options:
        run_cmd: "py %USERPROFILE%\\.config\\yasb\\get_latest_notif.py"
        run_interval: 1000
        return_format: "string"
      callbacks:
        on_left: "exec pyw %USERPROFILE%\\.config\\yasb\\show_popup.py"
      container_padding:
        top: 0
        left: 4
        bottom: 0
        right: 0

  weather:
    type: "yasb.weather.WeatherWidget"
    options:
      label: "<span>{icon}</span> {temp} <span class='sep'>|</span>"
      api_key: "f5bc02da05ce44f0b29231930251207"
      show_alerts: true
      update_interval: 600
      hide_decimal: true
      units: "metric"
      location: "Istanbul, Turkey"
      callbacks:
        on_left: "toggle_card"
        on_middle: "do_nothing"
        on_right: "toggle_label"
      icons:
        sunnyDay: "\ue30d"
        clearNight: "\ue32b"
        cloudyDay: "\ue312"
        cloudyNight: "\ue311"
        rainyDay: "\ue308"
        rainyNight: "\ue333"
        snowyDay: "\ue30a"
        snowyNight: "\ue335"
        blizzardDay: "\udb83\udf36"
        blizzardNight: "\udb83\udf36"
        foggyDay: "\ue303"
        foggyNight: "\ue346"
        thunderstormDay: "\ue30f"
        thunderstormNight: "\ue338"
        default: "\uebaa"
      container_padding:
        top: 0
        left: 0
        bottom: 0
        right: 0

  cpu:
    type: "yasb.cpu.CpuWidget"
    options:
      label: "<span>\uf4bc</span> {info[percent][total]}%"
      label_alt: "{info[histograms][cpu_percent]}"
      update_interval: 1000
      callbacks:
        on_left: "toggle_cpu_menu"
        on_middle: "exec cmd /c Taskmgr"
        on_right: "toggle_label"
      container_padding:
        top: 0
        left: 0
        bottom: 0
        right: 0

  memory:
    type: "yasb.memory.MemoryWidget"
    options:
      label: "<span>\uefc5</span> {virtual_mem_used}/{virtual_mem_total} <span class='sep'>|</span>"
      update_interval: 5000
      callbacks:
        on_left: "do_nothing"
        on_middle: "do_nothing"
        on_right: "do_nothing"
      container_padding:
        top: 0
        left: 0
        bottom: 0
        right: 0

  traffic:
    type: "yasb.traffic.TrafficWidget"
    options:
      label: "<span class='download'>\udb81\udf2e {download_speed}</span> <span class='upload'>\udb81\udf37 {upload_speed}</span> <span class='sep'>|</span>"
      update_interval: 1000
      container_padding:
        top: 0
        left: 0
        bottom: 0
        right: 0

  volume:
    type: "yasb.volume.VolumeWidget"
    options:
      label: "<span>{icon}</span> {level}%"
      volume_icons:
        - "\udb81\udf5f"
        - "\udb81\udf5e"
        - "\udb81\udf5d"
        - "\uf028"
        - "\uf028"
      callbacks:
        on_left: "toggle_volume_menu"
        on_right: "toggle_mute"
      container_padding:
        top: 0
        left: 0
        bottom: 0
        right: 0

  systray:
    type: "yasb.systray.SystrayWidget"
    options:
      class_name: "systray"
      label_collapsed: "\ue893"
      label_expanded: "\udb80\udd56"
      show_unpinned: false
      show_unpinned_button: true
      show_battery: false
      show_volume: false
      show_network: false
      container_padding:
        top: 0
        left: 0
        bottom: 0
        right: 0